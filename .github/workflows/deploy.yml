name: Deploy to Beget

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/silkway/**'
      - 'wp-content/plugins/polylang/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy theme + Polylang
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          set -euo pipefail
          RSH="ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no"

          sshpass -e rsync -az --delete \
            -e "$RSH" \
            wp-content/themes/silkway/ \
            "${SSH_USER}@${SSH_HOST}:${SSH_PATH}/wp-content/themes/silkway/"

          sshpass -e rsync -az --delete \
            -e "$RSH" \
            wp-content/plugins/polylang/ \
            "${SSH_USER}@${SSH_HOST}:${SSH_PATH}/wp-content/plugins/polylang/"

          echo "Deployed to ${SSH_HOST}:${SSH_PATH}"
